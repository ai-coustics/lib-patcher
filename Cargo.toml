[package]
name = "lib-patcher"
version = "0.1.0"
edition = "2024"
authors = ["Stephan Eckes <stephan.eckes@ai-coustics.com>"]
description = "Cross-platform symbol filtering for Rust static libraries to prevent linking conflicts"
readme = "README.md"
repository = "https://github.com/ai-coustics/lib-patcher"
license = "MIT OR Apache-2.0"
keywords = ["static-library", "linking", "symbol-filtering", "build-tools", "ffi"]
categories = ["development-tools::build-utils", "development-tools::ffi"]

[dependencies]
object = { version = "0.37", default-features = false, features = [
    "read_core",
    "write_core",
    "std",
    "archive",
    "coff",
    "pe",
    "elf",
    "macho",
] }
ar = "0.9"
clap = { version = "4.5", features = ["derive"] }
which = "8.0.0"
