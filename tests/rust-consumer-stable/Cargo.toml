[package]
name = "rust-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Built with the same stable toolchain as testlib, so shared dependencies
# (serde, serde_json) compile to byte-identical symbols. Without patching those
# collide with testlib's copies; the allowlist hides them so linking succeeds.
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
