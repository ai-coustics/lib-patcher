[package]
name = "rust-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The same crates testlib uses, so unpatched their symbols would collide. Built
# with both toolchains, stable and beta (see tests/README.md).
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
