[package]
name = "rust-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The same crates testlib uses, so without patching their symbols collide. This
# crate is built twice (see the CI workflow): with the same toolchain as testlib
# (stable) and a different one (beta); both must link cleanly once patched.
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
