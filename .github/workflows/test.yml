name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Both toolchains are installed: rust-consumer is built once with +beta
      # (different toolchain than the patched library) and once with +stable
      # (same as testlib). stable is installed last so it stays the default for
      # the tool build, unit tests, and testlib (which pins stable explicitly).
      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # testlib and the consumer are separate crates under tests/, each with
          # its own target dir; include them so their deps are cached too. The
          # consumer's beta and stable artifacts coexist in one target dir
          # (cargo keys fingerprints by rustc version).
          workspaces: |
            .
            tests/testlib
            tests/rust-consumer

      - name: Build lib-patcher CLI
        # Debug on purpose: the tool has no optimized behavior to test, but a
        # debug binary keeps overflow and debug_assert checks on while it patches
        # a real library, and shares artifacts with the unit-test build below.
        run: cargo build

      - name: Run unit tests
        run: cargo test

      - name: Build testlib static library
        working-directory: tests/testlib
        run: cargo build --release

      # Point the object-parsing regression test at the real static library the
      # toolchain just produced. Runs only on Windows: the guard is about COFF,
      # and the earlier "Run unit tests" step skips it (env var unset).
      - name: Verify object parses the real COFF archive (Windows)
        if: runner.os == 'Windows'
        env:
          LIB_PATCHER_REAL_COFF_ARCHIVE: tests/testlib/target/release/testlib.lib
        run: cargo test parses_real_windows_archive_when_provided

      - name: Patch testlib (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./target/debug/lib-patcher \
            --input tests/testlib/target/release/libtestlib.a \
            --output tests/testlib/target/release/libtestlib_patched.a \
            --keep-prefix testlib_
        shell: bash

      - name: Patch testlib (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\debug\lib-patcher.exe `
            --input tests\testlib\target\release\testlib.lib `
            --output tests\testlib\target\release\testlib_patched.lib `
            --keep-prefix testlib_
        shell: pwsh

      - name: Build and run C test (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: tests/c-consumer
        run: |
          make
          ./testlib-test
        shell: bash

      - name: Build and run C test (Windows)
        if: runner.os == 'Windows'
        working-directory: tests/c-consumer
        run: |
          lib /def:bcryptprimitives.def /out:bcryptprimitives.lib /machine:x64
          cl /Fe:testlib-test.exe main.c ..\testlib\target\release\testlib_patched.lib ws2_32.lib advapi32.lib userenv.lib bcrypt.lib ntdll.lib synchronization.lib bcryptprimitives.lib
          .\testlib-test.exe
        shell: cmd

      # The one rust-consumer crate is built with two toolchains. beta differs
      # from testlib's stable, so its dependency/std symbols would collide
      # without patching (the discriminating case). stable matches testlib, the
      # case the old denylist could not handle; the allowlist makes it link too.
      - name: Build and run Rust test (different toolchain, beta)
        working-directory: tests/rust-consumer
        run: |
          cargo +beta build --release
          cargo +beta run --release

      - name: Build and run Rust test (same toolchain, stable)
        working-directory: tests/rust-consumer
        run: |
          cargo +stable build --release
          cargo +stable run --release

      # Negative test: the UNPATCHED testlib must FAIL the static link, proving
      # patching is load-bearing and stopping the positive tests from silently
      # going vacuous if testlib and the consumer ever stop sharing conflicting
      # symbols. TESTLIB_LINK_LIB points build.rs at the unpatched archive.
      #
      # Uses +beta on purpose: with a different toolchain than testlib the std
      # symbols genuinely collide. Under +stable (same toolchain) the linker
      # resolves the identical archive members first-wins and links cleanly, so
      # it would not demonstrate a failure.
      #
      # Skipped on macOS: ld64 resolves duplicate symbols pulled from static
      # archives first-definition-wins rather than erroring, so an unpatched
      # library links there anyway. The discriminating platforms are Linux
      # (rust-lld) and Windows (link.exe: LNK2005 + LNK1169).
      - name: Assert unpatched testlib fails to link (Linux/Windows)
        if: runner.os != 'macOS'
        working-directory: tests/rust-consumer
        env:
          TESTLIB_LINK_LIB: testlib
        shell: bash
        run: |
          # On the Windows runner, Git-bash's /usr/bin/link.exe shadows MSVC's
          # link.exe on PATH; drop it so rustc resolves the MSVC linker (put
          # there by msvc-dev-cmd). Not touched on Linux, which links via cc.
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -f /usr/bin/link.exe /usr/bin/link
          fi
          if cargo +beta build --release > neg.log 2>&1; then
            echo "::error::unpatched testlib linked unexpectedly"
            cat neg.log
            exit 1
          fi
          grep -Eiq "duplicate symbol|LNK2005|LNK1169" neg.log || {
            echo "::error::link failed but without a duplicate-symbol diagnostic"
            cat neg.log
            exit 1
          }
          echo "unpatched testlib failed to link with duplicate-symbol errors, as expected"
