name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Both toolchains are installed: rust-consumer is built once with +beta
      # (different toolchain than the patched library) and once with +stable
      # (same as testlib). stable is installed last so it stays the default for
      # the tool build, unit tests, and testlib (which pins stable explicitly).
      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # testlib and the consumer are separate crates under tests/, each with
          # its own target dir; include them so their deps are cached too. The
          # consumer's beta and stable artifacts coexist in one target dir
          # (cargo keys fingerprints by rustc version).
          workspaces: |
            .
            tests/testlib
            tests/rust-consumer

      - name: Build lib-patcher CLI
        # Debug on purpose: the tool has no optimized behavior to test, but a
        # debug binary keeps overflow and debug_assert checks on while it patches
        # a real library, and shares artifacts with the unit-test build below.
        run: cargo build

      - name: Run unit tests
        run: cargo test

      # Two build styles: the default release build keeps std runtime symbols in
      # separate archive members, while the release-lto profile folds them into
      # the crate's own object. This changes whether an unpatched archive
      # collides at link time, so the consumer is tested against both.
      - name: Build testlib static library (both build styles)
        working-directory: tests/testlib
        run: |
          cargo build --release
          cargo build --profile release-lto

      # Point the object-parsing regression test at the real static library the
      # toolchain just produced. Runs only on Windows: the guard is about COFF,
      # and the earlier "Run unit tests" step skips it (env var unset).
      - name: Verify object parses the real COFF archive (Windows)
        if: runner.os == 'Windows'
        env:
          LIB_PATCHER_REAL_COFF_ARCHIVE: tests/testlib/target/release/testlib.lib
        run: cargo test parses_real_windows_archive_when_provided

      - name: Patch testlib (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for p in release release-lto; do
            ./target/debug/lib-patcher \
              --input tests/testlib/target/$p/libtestlib.a \
              --output tests/testlib/target/$p/libtestlib_patched.a \
              --keep-prefix testlib_
          done

      - name: Patch testlib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in 'release', 'release-lto') {
            .\target\debug\lib-patcher.exe `
              --input tests\testlib\target\$p\testlib.lib `
              --output tests\testlib\target\$p\testlib_patched.lib `
              --keep-prefix testlib_
          }

      - name: Build and run C test (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: tests/c-consumer
        run: |
          make
          ./testlib-test
        shell: bash

      - name: Build and run C test (Windows)
        if: runner.os == 'Windows'
        working-directory: tests/c-consumer
        run: |
          lib /def:bcryptprimitives.def /out:bcryptprimitives.lib /machine:x64
          cl /Fe:testlib-test.exe main.c ..\testlib\target\release\testlib_patched.lib ws2_32.lib advapi32.lib userenv.lib bcrypt.lib ntdll.lib synchronization.lib bcryptprimitives.lib
          .\testlib-test.exe
        shell: cmd

      # The full consumer matrix: testlib built without and with LTO x two
      # consumer toolchains (stable = same as testlib, beta = different).
      # TESTLIB_PROFILE selects the build, TESTLIB_LINK_LIB the patched or
      # unpatched archive.
      #
      #   * Patched: every combination must link AND run. This is what the tool
      #     guarantees, on every platform.
      #   * Unpatched: shows what patching is for. A static archive only collides
      #     when the consumer must pull an object that (re)defines std symbols:
      #       - non-LTO + same toolchain: std lives in separate archive members
      #         the consumer already defines, so they are skipped -> links.
      #       - LTO folds std into the crate object the consumer must pull for the
      #         public API -> collides.
      #       - a different toolchain drags in the archive's own std -> collides.
      #       - macOS ld64 resolves archive duplicates first-definition-wins, so
      #         nothing collides there regardless of build or toolchain.
      #
      # If a "links" case starts failing or a "fails" case starts linking, the
      # linker's archive-member selection or rustc's LTO packaging changed.
      - name: Rust consumer matrix (build styles x toolchains, patched + unpatched)
        working-directory: tests/rust-consumer
        shell: bash
        run: |
          set -u
          # On the Windows runner, Git-bash's /usr/bin/link.exe shadows MSVC's on
          # PATH; drop it so rustc uses the MSVC linker (from msvc-dev-cmd).
          # Untouched elsewhere: Linux/macOS do not use it.
          if [ "$RUNNER_OS" = "Windows" ]; then
            rm -f /usr/bin/link.exe /usr/bin/link
          fi

          fail=0
          # report EXPECTED ACTUAL CASE BUILD TOOLCHAIN: print one aligned line -
          # the matrix conditions, then a check/cross, then the outcome. Matches
          # get "(as expected)"; mismatches leave it off (more detail follows).
          report() {
            local expected=$1 actual=$2 mark verb suffix=""
            if [ "$expected" = "$actual" ]; then mark="✓"; suffix=" (as expected)"; else mark="✗"; fail=1; fi
            [ "$actual" = link ] && verb="linked" || verb="failed to link"
            printf '%-9s %-8s %-7s  %s %s%s\n' "$3" "$4" "$5" "$mark" "$verb" "$suffix"
          }

          for profile in release release-lto; do
            build=$([ "$profile" = release ] && echo non-lto || echo lto)
            for tc in beta stable; do
              # Patched: always expected to link (and run).
              if TESTLIB_PROFILE=$profile cargo +$tc run --release >out.log 2>&1; then
                report link link patched "$build" "+$tc"
              else
                report link fail patched "$build" "+$tc"
                cat out.log
              fi

              # Unpatched: expected to link only for separate std members with a
              # matching toolchain, or anywhere on macOS (ld64 first-wins).
              exp=fail
              if [ "$RUNNER_OS" = "macOS" ] || { [ "$profile" = release ] && [ "$tc" = stable ]; }; then
                exp=link
              fi
              if TESTLIB_PROFILE=$profile TESTLIB_LINK_LIB=testlib cargo +$tc build --release >out.log 2>&1; then
                report "$exp" link unpatched "$build" "+$tc"
              else
                report "$exp" fail unpatched "$build" "+$tc"
                # A failure must be a duplicate-symbol failure, not something else.
                if ! grep -Eiq "duplicate symbol|LNK2005|LNK1169" out.log; then
                  echo "    (but the failure was not a duplicate-symbol error:)"
                  cat out.log
                  fail=1
                fi
              fi
            done
          done

          echo
          if [ "$fail" = 0 ]; then
            echo "all matrix expectations met"
          else
            echo "::error::one or more matrix expectations were not met (see ✗ above)"
          fi
          exit $fail
