name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta

      - name: Build lib-patcher CLI
        run: cargo build --release

      - name: Build testlib static library
        run: |
          cd tests/testlib
          cargo +stable build --release
        shell: bash

      - name: Patch testlib (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./target/release/lib-patcher blocklist \
            --input tests/testlib/target/release/libtestlib.a \
            --output tests/testlib/target/release/libtestlib_patched.a
        shell: bash

      - name: Patch testlib (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\release\lib-patcher.exe blocklist `
            --input tests\testlib\target\release\testlib.lib `
            --output tests\testlib\target\release\testlib_patched.lib
        shell: pwsh

      - name: Build and run C test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd tests/c-consumer
          make
          ./testlib-test
        shell: bash

      - name: Build and run C test (Windows)
        if: runner.os == 'Windows'
        run: |
          cd tests\c-consumer
          cl /Fe:testlib-test.exe main.c ..\testlib\target\release\testlib_patched.lib ws2_32.lib advapi32.lib userenv.lib bcrypt.lib ntdll.lib
          .\testlib-test.exe
        shell: cmd

      - name: Build and run Rust test (different version)
        run: |
          cd tests/rust-consumer
          cargo +beta build --release
          cargo +beta run --release
        shell: bash

      - name: Success message
        run: |
          echo "✓ All integration tests passed on ${{ matrix.os }}!"
        shell: bash
