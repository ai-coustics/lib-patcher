name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta

      - name: Build lib-patcher CLI
        run: cargo build --release

      - name: Build testlib static library (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd tests/testlib
          cargo +stable build --release
        shell: bash

      - name: Build testlib static library (Windows)
        if: runner.os == 'Windows'
        run: |
          cd tests/testlib
          cargo +stable build --release
        shell: pwsh

      - name: Patch testlib (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./target/release/lib-patcher \
            --input tests/testlib/target/release/libtestlib.a \
            --output tests/testlib/target/release/libtestlib_patched.a \
            --keep-prefix testlib_
        shell: bash

      - name: Patch testlib (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\release\lib-patcher.exe `
            --input tests\testlib\target\release\testlib.lib `
            --output tests\testlib\target\release\testlib_patched.lib `
            --keep-prefix testlib_
        shell: pwsh

      - name: Build and run C test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd tests/c-consumer
          make
          ./testlib-test
        shell: bash

      # - name: Build and run C test (Windows)
      #   if: runner.os == 'Windows'
      #   run: |
      #     cd tests/c-consumer
      #     lib /def:bcryptprimitives.def /out:bcryptprimitives.lib /machine:x64
      #     $sysroot = rustc --print sysroot
      #     $stdlib = Get-ChildItem "$sysroot\lib\rustlib\x86_64-pc-windows-msvc\lib\std-*.lib" | Select-Object -First 1
      #     cl /Fe:testlib-test.exe main.c ..\testlib\target\release\testlib_patched.lib $stdlib ws2_32.lib advapi32.lib userenv.lib bcrypt.lib ntdll.lib synchronization.lib bcryptprimitives.lib
      #     .\testlib-test.exe
      #   shell: pwsh

      - name: Build and run Rust test (different version) (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd tests/rust-consumer
          cargo +beta build --release
          cargo +beta run --release
        shell: bash

      - name: Build and run Rust test (different version) (Windows)
        if: runner.os == 'Windows'
        run: |
          cd tests/rust-consumer
          cargo +beta build --release
          cargo +beta run --release
        shell: pwsh

      - name: Build and run Rust test (same version) (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd tests/rust-consumer-stable
          cargo +stable build --release
          cargo +stable run --release
        shell: bash

      - name: Build and run Rust test (same version) (Windows)
        if: runner.os == 'Windows'
        run: |
          cd tests/rust-consumer-stable
          cargo +stable build --release
          cargo +stable run --release
        shell: pwsh
