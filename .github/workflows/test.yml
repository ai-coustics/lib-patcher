name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # rust-consumer pins beta via its rust-toolchain.toml, exercising a consumer
      # built with a different toolchain than the patched library. stable is
      # installed after it so it stays the default for the tool build, unit tests,
      # and testlib (which pins stable explicitly).
      - name: Install Rust beta
        uses: dtolnay/rust-toolchain@beta

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # testlib and the consumers are separate crates under tests/, each
          # with its own target dir; include them so their deps are cached too.
          workspaces: |
            .
            tests/testlib
            tests/rust-consumer
            tests/rust-consumer-stable

      - name: Build lib-patcher CLI
        # Debug on purpose: the tool has no optimized behavior to test, but a
        # debug binary keeps overflow and debug_assert checks on while it patches
        # a real library, and shares artifacts with the unit-test build below.
        run: cargo build

      - name: Run unit tests
        run: cargo test

      - name: Build testlib static library
        working-directory: tests/testlib
        run: cargo build --release

      # Point the object-parsing regression test at the real static library the
      # toolchain just produced. Runs only on Windows: the guard is about COFF,
      # and the earlier "Run unit tests" step skips it (env var unset).
      - name: Verify object parses the real COFF archive (Windows)
        if: runner.os == 'Windows'
        env:
          LIB_PATCHER_REAL_COFF_ARCHIVE: tests/testlib/target/release/testlib.lib
        run: cargo test parses_real_windows_archive_when_provided

      - name: Patch testlib (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./target/debug/lib-patcher \
            --input tests/testlib/target/release/libtestlib.a \
            --output tests/testlib/target/release/libtestlib_patched.a \
            --keep-prefix testlib_
        shell: bash

      - name: Patch testlib (Windows)
        if: runner.os == 'Windows'
        run: |
          .\target\debug\lib-patcher.exe `
            --input tests\testlib\target\release\testlib.lib `
            --output tests\testlib\target\release\testlib_patched.lib `
            --keep-prefix testlib_
        shell: pwsh

      - name: Build and run C test (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: tests/c-consumer
        run: |
          make
          ./testlib-test
        shell: bash

      - name: Build and run C test (Windows)
        if: runner.os == 'Windows'
        working-directory: tests/c-consumer
        run: |
          lib /def:bcryptprimitives.def /out:bcryptprimitives.lib /machine:x64
          cl /Fe:testlib-test.exe main.c ..\testlib\target\release\testlib_patched.lib ws2_32.lib advapi32.lib userenv.lib bcrypt.lib ntdll.lib synchronization.lib bcryptprimitives.lib
          .\testlib-test.exe
        shell: cmd

      # Consumer built with a different toolchain (beta) than the patched library.
      - name: Build and run Rust test (different version)
        working-directory: tests/rust-consumer
        run: |
          cargo build --release
          cargo run --release

      # Negative test: the UNPATCHED testlib must FAIL the same static link.
      # This keeps the "patching is load-bearing" claim self-verifying and
      # stops the positive test above from silently going vacuous if testlib
      # and the consumer ever stop sharing conflicting symbols. TESTLIB_LINK_LIB
      # points the consumer's build.rs at the unpatched archive.
      #
      # Skipped on macOS: ld64 resolves duplicate symbols pulled from static
      # archives first-definition-wins rather than erroring, so an unpatched
      # library links there anyway. The discriminating platforms are Linux
      # (rust-lld) and Windows (link.exe: LNK2005 + LNK1169).
      - name: Assert unpatched testlib fails to link (Linux/Windows)
        if: runner.os != 'macOS'
        working-directory: tests/rust-consumer
        env:
          TESTLIB_LINK_LIB: testlib
        shell: bash
        run: |
          set -o pipefail
          if cargo build --release > neg.log 2>&1; then
            echo "::error::unpatched testlib linked unexpectedly"
            cat neg.log
            exit 1
          fi
          grep -Eiq "duplicate symbol|LNK2005|LNK1169" neg.log || {
            echo "::error::link failed but without a duplicate-symbol diagnostic"
            cat neg.log
            exit 1
          }
          echo "unpatched testlib failed to link with duplicate-symbol errors, as expected"

      # Consumer built with the same toolchain (stable) as the patched library.
      - name: Build and run Rust test (same version)
        working-directory: tests/rust-consumer-stable
        run: |
          cargo build --release
          cargo run --release
